<!doctype html>
<html lang="en">
  <head>
    <script>
      // Defensive polyfill for environments where window.fetch has only a getter (such as sandboxed iframes)
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          
          // Re-define window.fetch to support both getter and setter
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });

          // Also apply to self in case library attempts to assign to self.fetch
          if (typeof self !== 'undefined' && self !== window) {
            Object.defineProperty(self, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn("Unable to safely intercept and configure fetch property:", e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyPresensi Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
